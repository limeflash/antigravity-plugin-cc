name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: std only — no dependencies
        shell: bash
        run: |
          deps=$(cargo tree --locked --edges normal,build --prefix none | sort -u | wc -l | tr -d " ")
          if [ "$deps" -ne 1 ]; then
            echo "agy-plugin must not depend on any crate:"; cargo tree --locked; exit 1
          fi
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  launcher:
    name: launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck -s sh plugins/agy/bin/agy-plugin scripts/test-launcher.sh
      - name: launcher tests (sh)
        shell: bash
        run: |
          # Windows runs the downloaded .exe through Windows, so the fake
          # release binary there must be a real executable.
          if [ "$RUNNER_OS" = Windows ]; then
            cargo build --locked --example stub_agy
            export AGY_TEST_FAKE_EXE="$PWD/target/debug/examples/stub_agy.exe"
          fi
          sh scripts/test-launcher.sh
      - name: launcher tests (PowerShell 5.1 + 7)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --locked --example stub_agy
          $stub = (Resolve-Path target/debug/examples/stub_agy.exe).Path
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-launcher.ps1 -Stub $stub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/test-launcher.ps1 -Stub $stub
